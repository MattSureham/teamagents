# ── Agent Meetings Starter Config ──
# This is a minimal config to get started quickly.
# Run `am config discover` to detect more agents on your machine,
# or see meetings.config.example.yml for the full catalog of options.

server:
  port: 4200
  host: "0.0.0.0"
  dataDir: "./data"

agents:
  # ── Browser agent (free — no API key needed) ──
  # Opens a browser window. Log in to the chat UI manually.
  - id: chatgpt
    name: "ChatGPT"
    type: browser
    capabilities: [general, creative, brainstorming, coding]
    site: chatgpt
    timeoutMs: 120000

  # ── Subprocess agent (runs claude CLI locally) ──
  # Requires Claude Code installed: npm install -g @anthropic-ai/claude-code
  - id: claude-code
    name: "Claude Code"
    type: subprocess
    capabilities: [coding, building, debugging, testing, architecture]
    command: claude
    args: ["-p", "{prompt}", "--output-format", "text", "--dangerously-skip-permissions", "--bare"]
    timeoutMs: 3600000

  # ── LLM agent (API-based) ──
  # Set DEEPSEEK_API_KEY in your environment or a .env file.
  - id: deepseek
    name: "DeepSeek"
    type: llm
    capabilities: [architecture, planning, coding, analysis, reasoning]
    provider: deepseek
    model: deepseek-chat
    apiKey: "${DEEPSEEK_API_KEY}"

meetings:
  mode: debate
  turnTimeoutMs: 60000
  maxRebuttalRounds: 2
  maxDeliberationRounds: 3
  defaultModerator: deepseek
